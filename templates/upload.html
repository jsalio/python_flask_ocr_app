<!DOCTYPE html>
<html>
<head>
    <title>OCR - Images to Searchable PDF</title>
</head>
<body>
    <h1>Images to Searchable PDF</h1>

    {% if msg %}
    <p style="color: red;">{{ msg }}</p>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        <p>
            <label>Images (PNG, JPG, JPEG):</label><br>
            <input type="file" name="files" multiple accept=".png,.jpg,.jpeg">
        </p>
        <p>
            <label>OCR Language code:</label>
            <input type="text" name="lang" value="eng" placeholder="eng, spa, fra...">
        </p>
        <p><input type="submit" value="Generate Searchable PDF"></p>
    </form>
</body>
</html>
